name: Release

# Push a tag such as 0.2.1 (no "v"). This builds the release files from the
# tagged commit, attests their provenance, and publishes the GitHub Release.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - run: npm ci

      - name: Build release files
        run: node scripts/release.mjs --version "$GITHUB_REF_NAME"

      - name: Check versions were committed before tagging
        run: |
          if ! git diff --quiet; then
            echo "Version files differ from the tagged commit. Run the release script locally, commit, then tag."
            git diff --stat
            exit 1
          fi

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/${{ github.ref_name }}/obsidian/main.js
            release/${{ github.ref_name }}/obsidian/manifest.json
            release/${{ github.ref_name }}/obsidian/citekey-import-bridge-${{ github.ref_name }}.zip
            release/${{ github.ref_name }}/zotero/zotero-citekey-bridge-${{ github.ref_name }}.xpi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$GITHUB_REF_NAME"
          DIR="release/$VERSION"
          # Release notes: the CHANGELOG section for this version.
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          FILES="$DIR/obsidian/main.js $DIR/obsidian/manifest.json $DIR/obsidian/versions.json \
            $DIR/obsidian/citekey-import-bridge-$VERSION.zip \
            $DIR/zotero/zotero-citekey-bridge-$VERSION.xpi $DIR/zotero/zotero-updates.json"
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" $FILES --clobber
          else
            gh release create "$VERSION" $FILES --verify-tag --title "$VERSION" --notes-file notes.md
          fi
